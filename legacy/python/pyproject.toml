[project]
name = "agentcut"
version = "0.1.0"
description = "Agent-first video editor: declarative timeline JSON, CLI and MCP server, FFmpeg + NumPy renderer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "mcp>=1.2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
agentcut = "agentcut.cli:main"
agentcut-mcp = "agentcut.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcut"]
